<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理面板 · group-brain</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #5b8cff; --accent-soft: #5b8cff22;
    --ok: #4ade80; --warn: #ffb454; --bad: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  h2 { margin: 30px 0 10px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--accent-soft);
           color: var(--accent); font-size: 11px; vertical-align: 3px; margin-left: 8px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .sub a { color: var(--accent); text-decoration: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 14px 16px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .card .v small { font-size: 12px; font-weight: 400; color: var(--muted); }

  .task { background: var(--panel); border: 1px solid var(--line); border-radius: 11px;
          padding: 14px 16px; margin-bottom: 10px; }
  .task .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .task .name { font-weight: 600; }
  .task .cost { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .task button {
    padding: 7px 15px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent-soft); color: var(--accent); font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .task button:hover:not(:disabled) { filter: brightness(1.15); }
  .task button:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); color: var(--muted); background: transparent; }
  .task .state { font-size: 12px; margin-top: 8px; }
  .task .state.ok { color: var(--ok); }
  .task .state.fail { color: var(--bad); }
  .task .state.running { color: var(--warn); }
  pre.out {
    margin: 8px 0 0; padding: 10px 12px; background: #0b0d11; border: 1px solid var(--line);
    border-radius: 8px; font-size: 12px; line-height: 1.5; color: #c9d1e0;
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .err { padding: 12px 14px; border-radius: 10px; background: #3a1d1d; border: 1px solid #6b2b2b; color: #ffb4b4; }
  footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
  footer code { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>管理面板<span class="badge">v0.11</span></h1>
  <p class="sub">点按钮 = 在服务器上跑一次 <code>scripts/</code> 里的脚本。同一时间只允许一个任务。
     <a href="/">← 回到搜索</a> · <a href="/agent">Agent</a></p>

  <div id="top"></div>

  <h2>维护动作</h2>
  <div id="tasks"><div class="sub">读状态中…</div></div>

  <footer>
    说明：这里**没有**「重新导入聊天记录」按钮，因为服务器上没有 AstrBot 的原始库
    （群聊数据是从本机灌进去的，原始库留在本机）。要重灌聊天得在本机跑
    <code>scripts/import_messages.py</code>，再把 <code>data/group_brain.db</code> 传上来。
  </footer>
</div>

<script>
const $top = document.getElementById('top');
const $tasks = document.getElementById('tasks');
let mode = 'idle';

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

function renderTop(s) {
  const c = s.counts, f = s.files;
  $top.innerHTML = `
    <div class="grid">
      <div class="card"><div class="k">聊天消息</div><div class="v">${c.messages}</div></div>
      <div class="card"><div class="k">表情包</div><div class="v">${c.memes}</div></div>
      <div class="card"><div class="k">向量</div><div class="v">${c.vectors}<small> / ${c.messages + c.memes}</small></div></div>
      <div class="card"><div class="k">关键词索引</div><div class="v" style="color:${c.fts_ok ? 'var(--ok)' : 'var(--bad)'}">
        ${c.fts_ok ? '一致' : '不一致'}<small> ${c.messages_fts} 行</small></div></div>
      <div class="card"><div class="k">数据库文件</div><div class="v" style="font-size:16px">${f.db}<small> + wal ${f.wal}</small></div></div>
      <div class="card"><div class="k">Agent 记忆</div><div class="v">${(c.memory && c.memory.turns) || 0}<small> 轮 / ${(c.memory && c.memory.sessions) || 0} 个会话</small></div></div>
    </div>`;
}

function renderTasks(s) {
  $tasks.innerHTML = s.tasks.map(t => {
    const running = t.status === 'running';
    const stateText = running ? '跑着呢…'
      : t.status === 'ok' ? `完成 ${when(t.finished)}（退出码 ${t.rc}）`
      : t.status === 'fail' ? `失败 ${when(t.finished)}（退出码 ${t.rc}）`
      : '没跑过';
    const disabled = running || s.busy;
    return `<div class="task">
      <div class="row">
        <div>
          <div class="name">${esc(t.label)}</div>
          <div class="cost">${esc(t.cost)}</div>
        </div>
        <button data-task="${esc(t.name)}" ${disabled ? 'disabled' : ''}>
          ${running ? '运行中' : '运行'}</button>
      </div>
      <div class="note">${esc(t.note)}</div>
      <div class="state ${esc(t.status)}">${esc(stateText)}</div>
      ${t.out ? `<pre class="out">${esc(t.out)}</pre>` : ''}
    </div>`;
  }).join('');
}

function anyRunning(s) {
  return s.busy || s.tasks.some(t => t.status === 'running');
}

async function poll() {
  try {
    const r = await fetch('/api/admin/status', { cache: 'no-store' });
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const s = await r.json();
    renderTop(s);
    renderTasks(s);
    // 有任务在跑就 1 秒后接着看，否则 5 秒看一次
    setTimeout(poll, anyRunning(s) ? 1000 : 5000);
  } catch (e) {
    $tasks.innerHTML = `<div class="err">读取状态失败：${esc(e.message)}</div>`;
    setTimeout(poll, 5000);
  }
}

$tasks.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-task]');
  if (!btn) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/admin/run?task=' + encodeURIComponent(btn.dataset.task), { method: 'POST' });
    if (r.status === 401) { location.href = '/login'; return; }
    const j = await r.json();
    if (!j.ok) alert(j.error || '没启动起来');
  } catch (err) {
    alert('请求失败：' + err.message);
  }
  poll();
});

poll();
</script>
</body>
</html>
