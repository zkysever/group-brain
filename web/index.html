<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>group-brain · 群聊记忆体 v0.1</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-soft: #5b8cff22;
    --meme: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; }
  header h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  header p { margin: 0 0 28px; color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    vertical-align: 3px;
    margin-left: 8px;
  }

  .searchbar { display: flex; gap: 10px; }
  .searchbar input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar button {
    padding: 0 22px;
    border-radius: 11px;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .searchbar button:hover { filter: brightness(1.1); }

  .chips { display: flex; gap: 8px; margin: 14px 0 0; flex-wrap: wrap; }
  .chip {
    padding: 5px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .meta {
    margin: 22px 0 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .meta b { color: var(--text); font-weight: 600; }

  .hit {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    margin-bottom: 10px;
  }
  .hit .top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .hit .who { color: var(--accent); }
  .hit .who.meme { color: var(--meme); }
  .hit .body { white-space: pre-wrap; word-break: break-word; }
  .hit img {
    max-width: 180px;
    border-radius: 9px;
    margin-top: 10px;
    display: block;
  }
  .hit .kw { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .empty { color: var(--muted); padding: 26px 0; }
  .err {
    padding: 14px 16px;
    border-radius: 11px;
    background: #3a1d1d;
    border: 1px solid #6b2b2b;
    color: #ffb4b4;
    font-size: 14px;
  }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  footer code { background: var(--panel-2); padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>group-brain<span class="badge">v0.1</span></h1>
    <p>群聊记忆体 · 本地关键词检索（bigram + SQLite FTS5）</p>
  </header>

  <div class="searchbar">
    <input id="q" type="text" placeholder="搜点什么，比如：表情包 / 大肥鱼 / 别催" autocomplete="off">
    <button id="go">搜索</button>
  </div>

  <div class="chips" id="chips">
    <button class="chip on" data-kind="all">全部</button>
    <button class="chip" data-kind="message">聊天</button>
    <button class="chip" data-kind="meme">表情包</button>
  </div>

  <div class="meta" id="meta"></div>
  <div id="results"><div class="empty">输入关键词开始搜，回车也行。</div></div>

  <footer>
    数据源：<code>platform_message_history</code> + 两套表情包 pack。全部在本机，不联网。
  </footer>
</div>

<script>
const $q = document.getElementById('q');
const $go = document.getElementById('go');
const $results = document.getElementById('results');
const $meta = document.getElementById('meta');
const $chips = document.getElementById('chips');

let kind = 'all';
let booted = false;

// 服务可能还没起来（bat 里先开浏览器再起 uvicorn），带重试
async function waitForServer(retries = 20) {
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch('/api/health', { cache: 'no-store' });
      if (r.ok) return true;
    } catch (_) { /* 还没起来 */ }
    await new Promise(res => setTimeout(res, 500));
  }
  return false;
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    if (r.status === 401) { location.href = '/login'; return; }
    const s = await r.json();
    const tags = s.tags.map(t => t.tag).filter(Boolean).join(' / ');
    $meta.innerHTML =
      `<span>聊天 <b>${s.messages}</b> 条</span>` +
      `<span>表情包 <b>${s.memes}</b> 张</span>` +
      `<span>标签 ${tags || '-'}</span>`;
  } catch (e) {
    $meta.textContent = '';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function render(data) {
  if (!data.hits.length) {
    $results.innerHTML = '<div class="empty">没搜到。换个词，或者去掉一个字试试（单字走 LIKE 回退）。</div>';
    return;
  }
  const html = data.hits.map(h => {
    if (h.type === 'meme') {
      return `<div class="hit">
        <div class="top"><span class="who meme">表情包 · ${esc(h.tag || '-')} · ${esc(h.pack || '')}</span><span>${h.score.toFixed(3)}</span></div>
        <div class="body">${esc(h.text || '（无描述）')}</div>
        ${h.keywords ? `<div class="kw">关键词：${esc(h.keywords)}</div>` : ''}
        <img src="${esc(h.url)}" alt="表情" loading="lazy">
      </div>`;
    }
    return `<div class="hit">
      <div class="top"><span class="who">${esc(h.sender_name || '未知')}${h.kind === 'bot' ? ' · bot' : ''}</span><span>${esc(h.ts || '')}</span></div>
      <div class="body">${esc(h.text)}</div>
    </div>`;
  }).join('');
  $results.innerHTML = html;
}

async function doSearch() {
  const q = $q.value.trim();
  if (!q) {
    $results.innerHTML = '<div class="empty">输入关键词开始搜，回车也行。</div>';
    return;
  }
  $results.innerHTML = '<div class="empty">搜索中…</div>';
  try {
    const url = `/api/search?q=${encodeURIComponent(q)}&kind=${kind}&limit=20`;
    const r = await fetch(url);
    if (r.status === 401) { location.href = '/login'; return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data);
  } catch (e) {
    $results.innerHTML = `<div class="err">搜索失败：${esc(e.message)}。检查一下黑窗口里的 python 服务还在不在。</div>`;
  }
}

$go.addEventListener('click', doSearch);
$q.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

$chips.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  kind = btn.dataset.kind;
  [...$chips.children].forEach(c => c.classList.toggle('on', c === btn));
  if ($q.value.trim()) doSearch();
});

(async () => {
  const ok = await waitForServer();
  if (!ok) {
    $results.innerHTML = '<div class="err">连不上本地服务（127.0.0.1:8000）。黑窗口是不是关掉了？重新双击「双击启动.bat」。</div>';
    return;
  }
  booted = true;
  loadStats();
  $q.focus();
})();
</script>
</body>
</html>
