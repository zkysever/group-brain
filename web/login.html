<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口令 · group-brain</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2f3a;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-soft: #5b8cff22;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px 24px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    letter-spacing: -0.01em;
  }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #0f1115;
    color: var(--text);
    font: inherit;
    font-size: 16px;      /* iOS 上小于 16px 会自动放大页面 */
    letter-spacing: 0.06em;
    outline: none;
  }
  input[type=password]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .err {
    margin: 0 0 16px;
    padding: 9px 12px;
    border-radius: 8px;
    background: #ff6b6b1a;
    border: 1px solid #ff6b6b44;
    color: var(--bad);
    font-size: 13px;
  }
  .foot { margin: 18px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>口令</h1>
    <p class="sub">这里面是群里的聊天记录，先验一下。</p>
    {{ERR}}
    <label for="pw">访问口令</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password"
           autofocus required placeholder="输入口令">
    <button type="submit">进 去</button>
    <p class="foot">验证通过后这台设备 7 天内不用再输。</p>
  </form>
</body>
</html>
