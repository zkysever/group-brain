<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>group-brain · Agent v0.4</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1d2129;
    --line: #262b36;
    --text: #e7e9ee;
    --dim: #8b93a7;
    --accent: #5b8cff;
    --ok: #3ecf8e;
    --warn: #f0b400;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 64px;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .badge {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px;
    background: rgba(91,140,255,.15); color: var(--accent); font-size: 12px; vertical-align: middle;
  }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .row { display: flex; gap: 8px; margin-bottom: 6px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 12px 18px; font-size: 15px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; }
  .hints { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 22px; }
  .hint {
    padding: 5px 10px; font-size: 12px; border-radius: 999px; cursor: pointer;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
  }
  .hint:hover { color: var(--text); border-color: var(--accent); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; color: var(--dim); margin: 0 0 10px; font-weight: 500; letter-spacing: 1px; }
  .answer { font-size: 16px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: rgba(91,140,255,.12); color: var(--accent);
  }
  .chip.none { background: rgba(139,147,167,.12); color: var(--dim); }
  .chip.pre { background: rgba(139,147,167,.14); color: var(--dim); }
  .tool { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 12px; }
  .tool:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .tool .name { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--ok); }
  .tool .args { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--dim); word-break: break-all; }
  .hit { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .hit:first-of-type { border-top: 0; }
  .hit img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: var(--panel2); }
  .hit .txt { font-size: 13px; flex: 1; min-width: 0; }
  .hit .meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .err { color: var(--bad); }
  .foot { color: var(--dim); font-size: 12px; margin-top: 24px; }
  .foot a { color: var(--accent); text-decoration: none; }
  /* 清空记忆：故意做得又小又不显眼——它是保险丝，不是功能按钮 */
  button.mini {
    background: transparent; border: 1px solid rgba(139,147,167,.35);
    color: var(--dim); font-size: 11px; padding: 2px 8px; margin-left: 6px;
    border-radius: 99px; cursor: pointer;
  }
  button.mini:hover { color: var(--text); border-color: rgba(139,147,167,.6); }
  .spin { display: inline-block; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
<!-- 纠错记忆（v0.13）：它答错的地方，用户点一下就能教它，下次同样的话直接照这个答。
     放在回答卡下面而不是顶部，是因为「教」这个动作发生在看完答案之后。 -->
<style>
.fixbar { display: flex; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; }
.fixbar button { font-size: 12px; }
textarea {
  width: 100%; box-sizing: border-box; margin: 8px 0 10px;
  background: #0f1115; color: var(--text);
  border: 1px solid rgba(139,147,167,.25); border-radius: 8px;
  padding: 10px; font-size: 15px; font-family: inherit; resize: vertical;
}
textarea:focus { outline: none; border-color: var(--accent); }
.fixrow { border-top: 1px solid rgba(139,147,167,.12); padding: 10px 0; }
.fixrow:first-of-type { border-top: 0; }
.fixq { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
.fixa { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.fixmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
.tag { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>group-brain<span class="badge">Agent v0.5</span></h1>
  <div class="sub">把检索当工具交给模型：它自己决定调不调、调哪个。下面是它的调用记录，可以挑错；挑出来的错可以直接教它。</div>

  <div class="row">
    <input id="q" type="text" placeholder="问点需要翻记录的话，比如：谁说过要吃鱼片" autocomplete="off">
    <button id="go">问</button>
  </div>
  <div class="hints" id="hints"></div>

  <div id="out"></div>

  <div class="foot">
    同一个问题，<a href="/">直接检索</a>只有结果没有解释；这里多了「它有没有乱调工具」。
    <span style="color:var(--dim)">· 记忆存在服务器上，刷新/换设备都还在</span>
    <button id="forget" class="mini">清空记忆</button>
  </div>
</div>

<script>
const qEl = document.getElementById('q');
const goEl = document.getElementById('go');
const outEl = document.getElementById('out');

// 这三条是故意选的：第一条该调 search_memory，第二条该调 search_meme，
// 第三条根本不该调工具（用来抓「过度调用」）。
const HINTS = [
  '谁说过要吃鱼片',
  '给我一张生气的表情',
  '你好呀',
  '上次有人说我像什么',
  '今天几号'
];

HINTS.forEach(t => {
  const b = document.createElement('span');
  b.className = 'hint';
  b.textContent = t;
  b.onclick = () => { qEl.value = t; ask(); };
  document.getElementById('hints').appendChild(b);
});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function renderTrace(trace) {
  const card = el('div', 'card');
  card.appendChild(el('h2', null, '工具调用记录'));

  const chips = el('div', 'chips');
  if (!trace || trace.length === 0) {
    chips.appendChild(el('span', 'chip none', '一次都没调（纯聊天）'));
  } else {
    trace.forEach(t => {
      const label = t.tool + (t.n !== undefined ? ' · ' + t.n + ' 条' : '') + (t.ms ? ' · ' + t.ms + 'ms' : '');
      // 前置 = 这次是规则判定后替模型先跑的，不是模型自己要调的。
      // 区分出来才有意义：它说明「省掉了一次模型往返」，也说明这类题规则已经能接住。
      chips.appendChild(el('span', 'chip' + (t.prefetch ? ' pre' : ''), (t.prefetch ? '规则前置 · ' : '') + label));
    });
  }
  card.appendChild(chips);

  (trace || []).forEach(t => {
    const box = el('div', 'tool');
    box.appendChild(el('div', 'name', t.tool));
    const args = t.args && Object.keys(t.args).length ? JSON.stringify(t.args) : '（无参数）';
    box.appendChild(el('div', 'args', args + (t.mode && t.mode !== '-' ? '  ·  mode=' + t.mode : '')));
    (t.hits || []).forEach(h => {
      const row = el('div', 'hit');
      if (h.url) {
        const img = document.createElement('img');
        img.src = h.url;
        img.alt = '';
        row.appendChild(img);
      }
      const txt = el('div', 'txt');
      txt.appendChild(el('div', null, h.text || ''));
      txt.appendChild(el('div', 'meta', [h.who, h.ts, h.tag].filter(Boolean).join(' · ')));
      row.appendChild(txt);
      box.appendChild(row);
    });
    card.appendChild(box);
  });
  return card;
}

// 记忆已经搬到服务端（2026-11-12）：浏览器只留一个 gb_sess cookie，
// 问答记录在服务器上的 agent_turns 表里，所以刷新、换设备都还在。
// 前端不再拼 history 参数——客户端说的「上文」本来就不该被信任。

// 纠错记忆（v0.13）：回答下面给两个按钮——「不对，我教它」和「它学会的」。
// 为什么纠错要单独一块数据（corrections 表）而不是塞进对话记忆：
// 对话记忆是流水账，记「发生过什么」；纠错是结论，记「应该怎么答」。
// 流水账不会改变行为，结论会——下次问同一句话，直接照用户给的答案答，不叫模型。
function renderFix(q, d) {
  const wrap = el('div');

  const bar = el('div', 'fixbar');
  const teach = el('button', 'mini', '不对，我教它');
  const listBtn = el('button', 'mini', '它学会的');
  bar.appendChild(teach);
  bar.appendChild(listBtn);
  wrap.appendChild(bar);

  const box = el('div', 'card');
  box.hidden = true;
  box.appendChild(el('h2', null, '教它正确的一版'));
  box.appendChild(el('div', 'meta', '问题：' + q + '（匹配时忽略标点空格和大小写，不用一字不差）'));
  const ta = document.createElement('textarea');
  ta.rows = 3;
  ta.placeholder = '例：白系 AP 是《舞萌》里的一首歌';
  box.appendChild(ta);
  const save = el('button', null, '记住');
  box.appendChild(save);
  const hint = el('div', 'meta', '');
  box.appendChild(hint);
  wrap.appendChild(box);

  const list = el('div', 'card');
  list.hidden = true;
  list.appendChild(el('h2', null, '它学会的'));
  const listBody = el('div');
  list.appendChild(listBody);
  wrap.appendChild(list);

  teach.onclick = () => { box.hidden = !box.hidden; if (!box.hidden) ta.focus(); };

  save.onclick = async () => {
    const right = ta.value.trim();
    if (!right) { hint.textContent = '正确答案不能空着。'; return; }
    save.disabled = true;
    try {
      const r = await fetch('/api/agent/fix?q=' + encodeURIComponent(q)
        + '&right=' + encodeURIComponent(right)
        + '&wrong=' + encodeURIComponent(d.answer || ''));
      const j = await r.json();
      if (j.ok) {
        hint.textContent = '记住了。以后再问这句话，我直接照这个答（现在一共学了 ' + j.total + ' 条）。';
        ta.value = '';
      } else {
        hint.textContent = j.error || '没存上，再试一次。';
      }
    } catch (e) {
      hint.textContent = '网络错误：' + e;
    } finally {
      save.disabled = false;
    }
  };

  async function loadList() {
    listBody.innerHTML = '';
    const r = await fetch('/api/agent/fixes?limit=50');
    if (r.status === 401) { location.href = '/login'; return; }
    const j = await r.json().catch(() => ({}));
    listBtn.textContent = '它学会的（' + (j.total || 0) + '）';
    if (!j.rows || !j.rows.length) {
      listBody.appendChild(el('div', 'meta', '还没教过它任何东西。'));
      return;
    }
    j.rows.forEach(row => {
      const line = el('div', 'fixrow');
      line.appendChild(el('div', 'fixq', '问：' + row.question));
      line.appendChild(el('div', 'fixa', row.right));
      const meta = el('div', 'fixmeta');
      meta.appendChild(el('span', 'tag',
        [row.ts, row.source, '用过 ' + (row.hits || 0) + ' 次'].filter(Boolean).join(' · ')));
      const del = el('button', 'mini', '删掉');
      del.onclick = async () => {
        if (!confirm('删掉这条？删了它就又会自己瞎答了。')) return;
        await fetch('/api/agent/fix/delete?id=' + row.id, { method: 'POST' });
        loadList();
      };
      meta.appendChild(del);
      line.appendChild(meta);
      listBody.appendChild(line);
    });
  }

  listBtn.onclick = () => {
    list.hidden = !list.hidden;
    if (!list.hidden) loadList();
  };

  return wrap;
}

document.getElementById('forget').onclick = async () => {
  if (!confirm('清空这个会话的记忆？（服务端记录会一起删掉）')) return;
  const r = await fetch('/api/agent/forget', { method: 'POST' });
  const d = await r.json().catch(() => ({}));
  outEl.innerHTML = '';
  const c = el('div', 'card');
  c.appendChild(el('div', 'answer', '记忆已清空，删了 ' + (d.deleted || 0) + ' 条。'));
  outEl.appendChild(c);
};

async function ask() {
  const q = qEl.value.trim();
  if (!q) return;
  goEl.disabled = true;
  outEl.innerHTML = '';
  const loading = el('div', 'card');
  loading.appendChild(el('div', 'answer', '想一下…'));
  outEl.appendChild(loading);

  try {
    const r = await fetch('/api/agent?q=' + encodeURIComponent(q));
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();

    outEl.innerHTML = '';
    if (!d.ok) {
      const c = el('div', 'card');
      c.appendChild(el('div', 'answer err', d.error || '出错了'));
      outEl.appendChild(c);
      return;
    }

    const ans = el('div', 'card');
    ans.appendChild(el('h2', null, '回答'));
    ans.appendChild(el('div', 'answer', d.answer || '（空的）'));
    ans.appendChild(el('div', 'meta',
      (d.learned ? '这条是你教过的 · ' : '模型 ' + d.model + ' · ')
      + (d.learned ? '0 次工具调用 · ' : d.rounds + ' 轮工具 · ')
      + '一共 ' + d.took_ms + 'ms'
      + ' · 记得 ' + (d.memory_turns || 0) + ' 轮（服务端）'));
    outEl.appendChild(ans);
    outEl.appendChild(renderTrace(d.trace));
    outEl.appendChild(renderFix(q, d));
  } catch (e) {
    outEl.innerHTML = '';
    const c = el('div', 'card');
    c.appendChild(el('div', 'answer err', '网络错误：' + e));
    outEl.appendChild(c);
  } finally {
    goEl.disabled = false;
  }
}

goEl.onclick = ask;
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
